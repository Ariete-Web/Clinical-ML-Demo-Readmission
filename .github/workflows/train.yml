name: Train baseline

on:
  push:
    branches: [ main ]
    paths:
      - 'train_baseline.py'
      - 'requirements.txt'
      - 'data/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training
        run: python train_baseline.py

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            figures/roc.png
            figures/pr.png
            figures/calibration.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            artifacts/metrics.json
            artifacts/fairness_preview.json
